<div class="relative flex flex-col items-end">

  <div
    [class.hidden]="!isOpen()"
    class="flex flex-col gap-1 p-3 glass-card rounded-2xl border border-white/20 mb-3 shadow-2xl backdrop-blur-md w-56">

    <!-- Language -->
    <button (click)="changeLanguage()" class="w-full px-3 py-2 text-xs font-medium text-white/80 hover:text-white hover:bg-white/10 rounded-xl transition-all duration-200 flex items-center justify-between group cursor-pointer">
      <div class="flex items-center gap-3">
        <span class="text-sm opacity-80 group-hover:scale-110 transition-transform">🌐</span>
        <span>Idioma</span>
      </div>
      <span class="text-[10px] font-bold bg-white/10 px-1.5 py-0.5 rounded uppercase">{{ languageService.lang() }}</span>
    </button>

    <!-- Dark/Light mode -->
    <button (click)="toggleMode()" class="w-full px-3 py-2 text-xs font-medium text-white/80 hover:text-white hover:bg-white/10 rounded-xl transition-all duration-200 flex items-center justify-between group cursor-pointer">
      <div class="flex items-center gap-3">
        @if (themeService.mode() === 'dark') {
          <span class="text-sm opacity-80 group-hover:scale-110 transition-transform">🌙</span>
          <span>Modo oscuro</span>
        } @else {
          <span class="text-sm opacity-80 group-hover:scale-110 transition-transform">☀️</span>
          <span>Modo claro</span>
        }
      </div>
      <span class="text-[10px] font-bold bg-white/10 px-1.5 py-0.5 rounded uppercase">{{ themeService.mode() === 'dark' ? 'ON' : 'OFF' }}</span>
    </button>

    <div class="h-px bg-white/10 my-1 mx-2"></div>

    <!-- Color theme -->
    <div class="px-3 py-2">
      <p class="text-[10px] uppercase tracking-wider text-white/40 font-bold mb-3">Tema Visual</p>
      <div class="flex justify-between items-center gap-2">
        <button
          (click)="setColor('blue')"
          class="w-7 h-7 bg-blue-600 rounded-full cursor-pointer hover:scale-110 transition-all shadow-lg shadow-blue-600/20"
          [class.ring-2]="themeService.color() === 'blue'"
          [class.ring-white]="themeService.color() === 'blue'"
          title="Azul"></button>
        <button
          (click)="setColor('purple')"
          class="w-7 h-7 bg-purple-600 rounded-full cursor-pointer hover:scale-110 transition-all shadow-lg shadow-purple-600/20"
          [class.ring-2]="themeService.color() === 'purple'"
          [class.ring-white]="themeService.color() === 'purple'"
          title="Morado"></button>
        <button
          (click)="setColor('green')"
          class="w-7 h-7 bg-emerald-500 rounded-full cursor-pointer hover:scale-110 transition-all shadow-lg shadow-emerald-500/20"
          [class.ring-2]="themeService.color() === 'green'"
          [class.ring-white]="themeService.color() === 'green'"
          title="Verde"></button>
      </div>
    </div>
  </div>

  <button
    (click)="openCloseButton()"
    class="w-12 h-12 bg-white text-darkBg rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-all active:scale-95 cursor-pointer"
    aria-label="Settings">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </button>

</div>
