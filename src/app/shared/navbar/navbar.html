<nav class="site-navbar fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[min(94vw,72rem)]">
  <div class="glass-card rounded-3xl border border-white/10 bg-slate-950/70 backdrop-blur-xl px-4 py-3 md:px-6">
    <div class="flex items-center gap-3 md:gap-6">
      <a [routerLink]="[]" fragment="hero" (click)="closeMenu()" class="shrink-0 flex flex-col leading-none text-left hover:text-primary transition-colors">
        <span class="text-sm md:text-base font-semibold text-white/90">{{ t('nav.brand') }}</span>
        <span class="text-[10px] md:text-[11px] uppercase tracking-[0.35em] text-slate-400 mt-1">Portfolio</span>
      </a>

      <button
        type="button"
        class="menu-toggle ml-auto inline-flex items-center justify-center w-11 h-11 rounded-2xl border border-white/10 bg-white/5 text-white hover:bg-white/10 transition-colors"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-navigation"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()">
        @if (menuOpen()) {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        }
      </button>

      <div class="desktop-nav hidden flex-1 justify-center flex-wrap gap-x-5 gap-y-2 text-sm font-medium text-slate-200">
        @for (item of navItems; track item.fragment) {
          <a [routerLink]="[]" [fragment]="item.fragment" class="hover:text-primary transition-colors whitespace-nowrap">
            {{ t(item.label) }}
          </a>
        }
      </div>
    </div>

    @if (menuOpen()) {
      <div id="main-navigation" class="mobile-nav mt-4 pt-4 border-t border-white/10">
        <div class="grid grid-cols-1 gap-2 text-sm font-medium text-slate-200">
          @for (item of navItems; track item.fragment) {
            <a
              [routerLink]="[]"
              [fragment]="item.fragment"
              (click)="closeMenu()"
              class="flex items-center justify-between rounded-2xl px-4 py-3 bg-white/5 hover:bg-white/10 hover:text-primary transition-colors">
              <span>{{ t(item.label) }}</span>
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
              </svg>
            </a>
          }
        </div>
      </div>
    }
  </div>
</nav>
